<!---apply button and save button background color change and border width change after hovering over them-->
<style>
.apply-button
{
background-color:rgb(10, 102, 194);
color:white;
font-weight:bold;
border:none;
border-radius:50px;
height:50px;
width:200px;
margin-right:20px;
cursor:pointer;
transition: background-color 0.15s;
}

.apply-button:hover {
    background-color: rgba(2,70,138);
}

.save-button
{
background-color:white;;
color:rgb(10, 102, 194);
font-weight:bold;
border-radius:50px;
border-style:solid;
border-color:rgb(10, 102, 194);
height:50px;
width:100px;
margin-right:8px;
cursor:pointer;
}

.save-button:hover {
    background-color: rgba(10, 102, 194, 0.2);
    border-width:2px;
}
</style>
<button class="apply-button">Apply on company website</button>
<button class="save-button">Save</button>
